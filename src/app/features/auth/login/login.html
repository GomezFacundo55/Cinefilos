<div class="auth-contenedor">
  <div class="auth-card">
    <h2>Ingresar</h2>
    <p class="auth-subtitulo">Accede a tus entradas y beneficios cinéfilos</p>

    <!-- Cartel de error cuando falla la autenticación -->
    @if (errorMensaje) {
      <div class="mensaje-error">
        {{ errorMensaje }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="campo-grupo">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="tu@email.com" 
          required 
        />
      </div>

      <div class="campo-grupo">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" class="btn-auth" [disabled]="cargando">
        {{ cargando ? 'Iniciando sesión...' : 'Entrar' }}
      </button>
    </form>

    <div class="auth-footer">
      ¿No tienes cuenta? <a routerLink="/registro">Créala gratis</a>
    </div>
  </div>
</div>
